<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paul des Brosses — Portfolio</title>
  <meta name="description" content="Portfolio de Paul des Brosses : systèmes embarqués, traitement du signal, modélisation spatiale et prototypage hardware/software.">
  <meta name="theme-color" content="#F4F1EA">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="canonical" href="https://paul-des-brosses.github.io/fr/">
  <link rel="alternate" hreflang="fr" href="https://paul-des-brosses.github.io/fr/">
  <link rel="alternate" hreflang="en" href="https://paul-des-brosses.github.io/en/">
  <link rel="alternate" hreflang="x-default" href="https://paul-des-brosses.github.io/fr/">
  <!-- Repli sans JavaScript : la version française reste la destination par défaut. -->
  <noscript><meta http-equiv="refresh" content="0; url=fr/index.html"></noscript>
  <script>
    // Redirection selon la langue du navigateur, français par défaut.
    (function () {
      var langs = navigator.languages || [navigator.language || 'fr'];
      var prefersEnglish = true;
      for (var i = 0; i < langs.length; i++) {
        var l = String(langs[i]).toLowerCase();
        if (l.indexOf('fr') === 0) { prefersEnglish = false; break; }
        if (l.indexOf('en') === 0) { break; }
      }
      location.replace(prefersEnglish ? 'en/index.html' : 'fr/index.html');
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: #F4F1EA;
      color: #2A3235;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.95rem;
    }
    a { color: #58879B; }
  </style>
</head>
<body>
  <p>Portfolio&nbsp;: <a href="fr/index.html">Français</a> &middot; <a href="en/index.html">English</a></p>
</body>
</html>
